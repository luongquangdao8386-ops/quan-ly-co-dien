    if (!air) rows.push(['Bơm giải nhiệt (mỗi chiller)', `${f(Pp2, 1)} kW trục → động cơ ${M2} kW`, `${f(Fcw, 0)} m³/h, ${f(v.Hcw)} m`]);
    rows.push(['Điện năng/năm (chiller + bơm)', f(E, 0), 'kWh'], ['Chi phí điện/năm', f(E * (v.price || 0) / 1e6, 0), 'triệu đồng']);
    return {
      main: [
        { l: 'Chiller đề xuất', v: `${n} × ${TRch}`, u: 'TR', sub: `${f(Qch, 0)} kW mỗi máy, COP ${f(cop, 1)}`, s: 'hl' },
        { l: 'Nước lạnh mỗi máy', v: f(Fchw, 0), u: 'm³/h', sub: `${f(v.tchws)}/${f(v.tchwr)} °C, ống chính DN${hChw.dn}` },
        { l: air ? 'Điện mỗi chiller' : 'Tháp giải nhiệt', v: air ? f(Pch, 0) : f(towerRT, 0), u: air ? 'kW' : 'RT', sub: air ? `${f(Ich, 0)} A ở 400 V` : `mỗi chiller, nước ${f(Fcw, 0)} m³/h` },
        { l: 'Hiệu suất toàn hệ', v: f(kwtr, 2), u: 'kW/TR', sub: `Điện năng ${f(E / 1000, 0)} MWh/năm` }
      ],
      checks, rows,
      steps: [
        `Tải mỗi chiller = ${f(Qd, 0)} kW / ${run} máy / 3,517 = ${f(TRreq, 1)} TR → chọn ${TRch} TR`,
        `Lưu lượng nước lạnh = Q / (4,186 × Δt) = ${f(Qch, 0)} / (4,186 × ${f(dtc)}) = ${f(Fchw / 3.6, 2)} kg/s = ${f(Fchw, 1)} m³/h`,
        ...(air ? [] : [`Nhiệt thải = Q + P = ${f(Qch, 0)} + ${f(Pch, 0)} = ${f(Qrej, 0)} kW → nước giải nhiệt = ${f(Qrej, 0)} / (4,186 × ${f(dtw)}) × 3,6 = ${f(Fcw, 1)} m³/h; tháp = ${f(Qrej, 0)} / 4,535 = ${f(towerRT, 0)} RT`]),
        `Công suất bơm = ρ·g·Q·H / η = 9,81 × ${f(Fchw / 3600, 4)} × ${f(v.Hchw)} / ${f(eta, 2)} = ${f(Pp1, 2)} kW`,
        `kW/TR toàn hệ = (P<sub>chiller</sub> + P<sub>bơm</sub>) / TR = ${f(Ptot, 0)} / ${f(run * TRch)} = ${f(kwtr, 3)}`
      ],
      notes: ['COP là giá trị điển hình ở điều kiện định mức; lấy theo catalogue hãng (Trane, Daikin, Carrier, York…). Điện năng tính với COP đầy tải – thực tế ở tải một phần thường tốt hơn.', 'Chưa gồm quạt tháp giải nhiệt (thường 1–2% công suất lạnh) và AHU/FCU.']
    };
  }
});

/* ===== 5.3 Thông gió xưởng ===== */
M({
  id: 'vent', grp: 3, tag: 'TG', name: 'Thông gió, hút nhiệt xưởng',
  desc: 'Tính lưu lượng gió theo nhiệt thải hoặc số lần trao đổi gió, số quạt hút, cửa lấy gió bổ sung và kích thước ống gió.',
  ref: 'Cân bằng nhiệt Q = ρ·c<sub>p</sub>·V·Δt; bội số trao đổi gió tham khảo TCVN 5687; ống gió theo phương pháp vận tốc',
  fields: [
    { type: 'sec', label: 'Nhà xưởng' },
    { id: 'L', type: 'num', label: 'Chiều dài', unit: 'm', def: 60 },
    { id: 'W', type: 'num', label: 'Chiều rộng', unit: 'm', def: 30 },
    { id: 'H', type: 'num', label: 'Chiều cao trung bình', unit: 'm', def: 9 },
    { id: 'mode', type: 'sel', label: 'Tính theo', opts: [['heat', 'Nhiệt thải trong xưởng'], ['ach', 'Số lần trao đổi gió']], def: 'heat' },
    { id: 'Q', type: 'num', label: 'Tổng nhiệt thải vào không khí', unit: 'kW', def: 300, show: v => v.mode === 'heat', help: 'Động cơ ≈ (1 − η) × P; máy sấy, đường hơi, bức xạ mái. Máy xeo, sóng giấy thường rất lớn.' },
    { id: 'dT', type: 'num', label: 'Chênh nhiệt độ trong – ngoài cho phép', unit: 'K', def: 4 },
    { id: 'ach', type: 'num', label: 'Số lần trao đổi gió', unit: 'lần/h', def: 20, show: v => v.mode === 'ach', help: 'Kho: 4–6; xưởng thường: 10–15; xưởng nóng, máy sấy: 20–30.' },
    { type: 'sec', label: 'Quạt và ống gió' },
    { id: 'fq', type: 'num', label: 'Lưu lượng mỗi quạt', unit: 'm³/h', def: 38000, help: 'Quạt hút vuông 1380 mm thường 35.000–44.000 m³/h. Lấy theo catalogue.' },
    { id: 'fkw', type: 'num', label: 'Công suất mỗi quạt', unit: 'kW', def: 1.1 },
    { id: 'vd', type: 'num', label: 'Vận tốc gió trong ống (nếu đi ống)', unit: 'm/s', def: 8, help: 'Ống chính 6–10 m/s; nhánh 4–6 m/s.' }
  ],
  calc(v) {
    const V = v.L * v.W * v.H;
    if (!(V > 0)) return { error: 'Nhập kích thước nhà xưởng.' };
    if (!(v.fq > 0)) return { error: 'Nhập lưu lượng quạt.' };
    const Vheat = v.Q > 0 && v.dT > 0 ? v.Q / (1.206 * v.dT) * 3600 : 0;
    const Vach = (v.ach || 0) * V;
    const need = v.mode === 'heat' ? Vheat : Vach;
    if (!(need > 0)) return { error: v.mode === 'heat' ? 'Nhập nhiệt thải và chênh nhiệt độ cho phép.' : 'Nhập số lần trao đổi gió.' };
    const nf = Math.ceil(need / v.fq), Vact = nf * v.fq, achAct = Vact / V, kW = nf * (v.fkw || 0);
    const dtAct = v.mode === 'heat' ? v.Q / (1.206 * Vact / 3600) : (v.Q > 0 ? v.Q / (1.206 * Vact / 3600) : null);
    const vd = v.vd > 0 ? v.vd : 8, A1 = v.fq / 3600 / vd;
    const D = nextStd(DUCT_D, Math.sqrt(4 * A1 / Math.PI) * 1000) || Math.ceil(Math.sqrt(4 * A1 / Math.PI) * 1000);
    const hR = Math.ceil(Math.sqrt(A1 / 2) * 1000 / 50) * 50, wR = Math.ceil(A1 / (hR / 1000) * 1000 / 50) * 50;
    const vD = v.fq / 3600 / (Math.PI * Math.pow(D / 1000, 2) / 4);
    const dpm = 0.02 * (1.2 * vD * vD / 2) / (D / 1000);
    const louver = Vact / 3600 / 2 / 0.5;
    const checks = [chk(OK, `${nf} quạt × ${f(v.fq, 0)} m³/h = ${f(Vact, 0)} m³/h, trao đổi gió ${f(achAct, 1)} lần/h`)];
    if (dtAct != null && v.mode === 'heat') checks.push(chk(dtAct <= v.dT ? OK : WARN, `Nhiệt độ trong xưởng cao hơn ngoài trời ≈ ${f(dtAct, 1)} K`));
    checks.push(chk(INFO, `Cần cửa lấy gió bổ sung ≈ ${f(louver, 1)} m² (tốc độ qua cửa 2 m/s, cửa chớp thoáng 50%) – thiếu gió bổ sung, quạt sẽ không đạt lưu lượng.`));
    if (achAct > 40) checks.push(chk(WARN, 'Trao đổi gió rất lớn: cân nhắc hút nhiệt cục bộ tại nguồn (chụp hút máy sấy) hoặc làm mát bằng tấm cooling pad.'));
    return {
      main: [
        { l: 'Lưu lượng gió cần', v: f(need, 0), u: 'm³/h', sub: v.mode === 'heat' ? `Theo nhiệt thải, tương đương ${f(need / V, 1)} lần/h` : `${f(v.ach)} lần/h × ${f(V, 0)} m³`, s: 'hl' },
        { l: 'Số quạt hút', v: String(nf), u: 'quạt', sub: `Tổng ${f(kW, 1)} kW điện` },
        { l: 'Ống gió tròn / chữ nhật', v: `Ø${D}`, u: 'mm', sub: `hoặc ${wR} × ${hR} mm cho 1 quạt` },
        { l: 'Cửa lấy gió bổ sung', v: f(louver, 1), u: 'm²', sub: 'Tổng diện tích cửa chớp' }
      ],
      checks,
      rows: [
        ['Thể tích xưởng', f(V, 0), 'm³'],
        ['Lưu lượng theo nhiệt thải', Vheat ? f(Vheat, 0) : '—', 'm³/h'],
        ['Lưu lượng theo trao đổi gió', Vach ? f(Vach, 0) : '—', 'm³/h'],
        ['Vận tốc trong ống tròn', f(vD, 1), 'm/s'],
        ['Tổn thất ma sát ống tròn (ước tính)', f(dpm, 2), 'Pa/m']
      ],
      steps: [
        `V = Q / (ρ × c<sub>p</sub> × Δt) = ${f(v.Q || 0)} / (1,2 × 1,005 × ${f(v.dT)}) = ${f(Vheat / 3600, 2)} m³/s = ${f(Vheat, 0)} m³/h`,
        `Số quạt = ${f(need, 0)} / ${f(v.fq, 0)} = ${f(need / v.fq, 2)} → ${nf} quạt`,
        `Ống: A = V / v = ${f(v.fq / 3600, 3)} / ${f(vd)} = ${f(A1, 3)} m² → Ø${D} mm; chữ nhật tỷ lệ 2:1 → ${wR} × ${hR} mm`,
        `Ma sát: Δp/L ≈ λ × (ρv²/2) / D với λ ≈ 0,02 → ${f(dpm, 2)} Pa/m`
      ]
    };
  }
});

const SEASON = { nom: [22, 95], summer: [35, 58], rain: [30, 85], dry: [15, 45] };
M({
  id: 'humid', grp: 3, tag: 'ĐA', name: 'Độ ẩm kho giấy, xưởng in',
  desc: 'Tính lượng ẩm cần hút hoặc cần bổ sung để giữ độ ẩm cho giấy, điểm sương và nguy cơ đọng sương trên cuộn giấy, chọn máy hút ẩm hoặc tạo ẩm.',
  ref: 'Tâm lý học không khí (ASHRAE Fundamentals, công thức Magnus); khuyến nghị bảo quản giấy 45–55% RH',
  fields: [
    { type: 'sec', label: 'Kho hoặc xưởng' },
    { id: 'L', type: 'num', label: 'Chiều dài', unit: 'm', def: 50 },
    { id: 'W', type: 'num', label: 'Chiều rộng', unit: 'm', def: 30 },
    { id: 'H', type: 'num', label: 'Chiều cao', unit: 'm', def: 8 },
    { id: 'tin', type: 'num', label: 'Nhiệt độ trong kho', unit: '°C', def: 26 },
    { id: 'rhin', type: 'num', label: 'Độ ẩm mong muốn', unit: '%', def: 52, help: 'Giấy, bao bì: 45–55%. Phòng in offset: 50–55% ở 23–25 °C.' },
    { id: 'ach', type: 'num', label: 'Gió ngoài lọt vào, thông gió', unit: 'lần/h', def: 0.8, help: 'Kho kín, cửa cuốn: 0,3–0,5; cửa mở thường xuyên cho xe nâng: 1–2.' },
    { type: 'sec', label: 'Thời tiết ngoài trời' },
    { id: 'season', type: 'sel', label: 'Kịch bản', opts: [['nom', 'Nồm ẩm miền Bắc (22 °C, 95%)'], ['rain', 'Mùa mưa (30 °C, 85%)'], ['summer', 'Hè nắng nóng (35 °C, 58%)'], ['dry', 'Hanh khô mùa đông (15 °C, 45%)'], ['custom', 'Tự nhập']], def: 'nom' },
    { id: 'tout', type: 'num', label: 'Nhiệt độ ngoài trời', unit: '°C', def: 22, show: v => v.season === 'custom' },
    { id: 'rhout', type: 'num', label: 'Độ ẩm ngoài trời', unit: '%', def: 95, show: v => v.season === 'custom' },
    { type: 'sec', label: 'Cuộn giấy' },
    { id: 'tp', type: 'num', label: 'Nhiệt độ bề mặt cuộn giấy, sàn, tường lạnh', unit: '°C', def: 20, help: 'Giấy vừa nhập từ kho lạnh, sàn bê tông buổi sáng thường lạnh hơn không khí.' }
  ],
  calc(v) {
    const V = v.L * v.W * v.H;
    if (!(V > 0)) return { error: 'Nhập kích thước kho.' };
    const [tout, rhout] = v.season === 'custom' ? [v.tout, v.rhout] : SEASON[v.season];
    if (!(v.rhin > 0 && v.rhin < 100 && rhout > 0 && rhout <= 100)) return { error: 'Độ ẩm phải trong khoảng 1–100%.' };
    const wi = wAbs(v.tin, v.rhin), wo = wAbs(tout, rhout);
    const Tdi = dewFromW(wi), Tdo = dewFromW(wo);
    const Vair = (v.ach || 0) * V, mair = 1.2 * Vair;
    const dm = mair * (wo - wi);
    const need = Math.abs(dm) * 1.2, lat = Math.abs(dm) * 2501 / 3600;
    const dehum = dm > 0;
    const checks = [];
    if (dehum) checks.push(chk(WARN, `Không khí ngoài ẩm hơn (${f(wo * 1000, 1)} g/kg so với ${f(wi * 1000, 1)} g/kg) → cần hút ẩm ${f(need, 1)} kg/h, đồng thời giữ kho kín.`));
    else checks.push(chk(WARN, `Không khí ngoài khô hơn → cần bổ sung ẩm ${f(need, 1)} kg/h để giữ ${f(v.rhin)}%, tránh giấy co, cong vênh, tĩnh điện.`));
    const risk = v.tp < Tdi + 1;
    checks.push(chk(risk ? BAD : OK, risk ? `Bề mặt ${f(v.tp)} °C thấp hơn hoặc sát điểm sương trong kho ${f(Tdi, 1)} °C → đọng sương trên cuộn giấy, sàn. Giữ nguyên màng bọc cuộn giấy đến khi nhiệt độ cân bằng (thường 24–48 giờ).` : `Bề mặt ${f(v.tp)} °C cao hơn điểm sương trong kho ${f(Tdi, 1)} °C – không đọng sương.`));
    if (Tdo > v.tp) checks.push(chk(WARN, `Điểm sương không khí ngoài ${f(Tdo, 1)} °C > ${f(v.tp)} °C: mở cửa đón gió ẩm vào sẽ gây đọng sương ngay – hạn chế mở cửa, dùng rèm gió.`));
    return {
      main: [
        { l: dehum ? 'Cần hút ẩm' : 'Cần tạo ẩm', v: f(need, 1), u: 'kg/h', sub: dehum ? `≈ ${f(need * 24, 0)} lít/ngày (đã dư 20%)` : `≈ ${f(need * 24, 0)} lít nước/ngày (đã dư 20%)`, s: 'hl' },
        { l: 'Điểm sương trong kho', v: f(Tdi, 1), u: '°C', sub: `Ngoài trời ${f(Tdo, 1)} °C` },
        { l: 'Độ chứa hơi trong / ngoài', v: `${f(wi * 1000, 1)} / ${f(wo * 1000, 1)}`, u: 'g/kg', sub: `Ngoài trời ${f(tout)} °C, ${f(rhout)}%` },
        { l: 'Nhiệt ẩn tương ứng', v: f(lat, 1), u: 'kW', sub: dehum ? 'Tải ẩm cho hệ hút ẩm/điều hòa' : 'Nhiệt cần để bốc hơi nước' }
      ],
      checks,
      rows: [
        ['Thể tích kho', f(V, 0), 'm³'],
        ['Lưu lượng gió ngoài', f(Vair, 0), 'm³/h'],
        ...(dehum ? [['Máy hút ẩm công nghiệp (tổng)', f(need * 24, 0), 'lít/ngày ở điều kiện định mức 30 °C/80%']] : [
          ['Tạo ẩm bằng hơi (điện trở)', `≈ ${f(need * 0.75, 1)}`, 'kW điện'],
          ['Tạo ẩm phun sương cao áp', `≈ ${f(need * 0.01 + 0.3, 1)}`, 'kW điện, đồng thời làm mát ' + f(need * 0.69, 1) + ' kW']])
      ],
      steps: [
        'Áp suất hơi bão hòa p<sub>s</sub> = 610,94 × e<sup>17,625·t/(t + 243,04)</sup> (Pa); độ chứa hơi w = 0,622 × φ·p<sub>s</sub> / (p − φ·p<sub>s</sub>)',
        `w<sub>trong</sub> = ${f(wi * 1000, 2)} g/kg; w<sub>ngoài</sub> = ${f(wo * 1000, 2)} g/kg`,
        `Lượng ẩm = ρ × V × Δw = 1,2 × ${f(Vair, 0)} × ${f(wo - wi, 5)} = ${f(dm, 2)} kg/h (dương: thừa ẩm, âm: thiếu ẩm)`,
        `Điểm sương trong kho = ${f(Tdi, 1)} °C`
      ],
      notes: ['Chưa kể ẩm từ người, sàn ướt và giấy nhả ẩm. Công suất máy hút ẩm ghi trên nhãn ở 30 °C/80% – ở 26 °C/55% thực tế chỉ còn khoảng 40–50%, cần chọn dư.']
    };
  }

/* ===== 6.1 Khí nén: nhu cầu và máy nén ===== */
const CMP_KW = [5.5, 7.5, 11, 15, 18.5, 22, 30, 37, 45, 55, 75, 90, 110, 132, 160, 200, 250, 315];
const RCV = [300, 500, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 8000, 10000];
M({
  id: 'air', grp: 4, tag: 'KN', name: 'Nhu cầu khí nén & chọn máy nén',
  desc: 'Tổng hợp nhu cầu khí nén theo thiết bị, chọn máy nén, bình chứa, máy sấy, cấp chất lượng khí, lượng nước ngưng và chi phí điện.',
  ref: 'Atlas Copco Compressed Air Manual; ISO 8573-1 (chất lượng khí nén); ISO 1217 (FAD)',
  fields: [
    { type: 'sec', label: 'Thiết bị dùng khí' },
    {
      id: 'cons', type: 'table', label: 'Danh sách thiết bị', help: 'Lưu lượng khi làm việc lấy theo catalogue (Nl/min – lít khí tự do/phút). Hệ số làm việc: tỷ lệ thời gian thiết bị dùng khí.',
      cols: [{ id: 'ten', label: 'Thiết bị', type: 'text', w: '40%' }, { id: 'sl', label: 'SL', type: 'num' }, { id: 'q', label: 'Nl/min mỗi cái', type: 'num' }, { id: 'duty', label: 'Làm việc (%)', type: 'num' }],
      newRow: { ten: '', sl: 1, q: 100, duty: 50 },
      def: [
        { ten: 'Cơ cấu khí nén máy xeo/sóng', sl: 1, q: 6000, duty: 80 },
        { ten: 'Thổi mép giấy, dao cắt', sl: 4, q: 600, duty: 50 },
        { ten: 'Máy in (kẹp, nâng giấy)', sl: 3, q: 400, duty: 60 },
        { ten: 'Xi lanh máy dán thùng', sl: 6, q: 150, duty: 40 },
        { ten: 'Súng thổi bụi, vệ sinh', sl: 8, q: 250, duty: 15 }
      ]
    },
    { type: 'sec', label: 'Hệ số và áp suất' },
    { id: 'ks', type: 'num', label: 'Hệ số đồng thời', def: 0.9 },
    { id: 'leak', type: 'num', label: 'Rò rỉ', unit: '%', def: 10, help: 'Hệ thống bảo trì tốt 5–10%; không kiểm tra định kỳ 20–30%.' },
    { id: 'res', type: 'num', label: 'Dự phòng phát triển', unit: '%', def: 20 },
    { id: 'preq', type: 'num', label: 'Áp suất cần tại thiết bị', unit: 'bar g', def: 6 },
    { id: 'pdrop', type: 'num', label: 'Tổn thất qua sấy, lọc, đường ống', unit: 'bar', def: 1 },
    { type: 'sec', label: 'Máy nén' },
    { id: 'type', type: 'sel', label: 'Loại máy nén', opts: [['fixed', 'Trục vít tốc độ cố định'], ['vsd', 'Trục vít biến tần (VSD)']], def: 'fixed' },
    { id: 'sp', type: 'num', label: 'Suất tiêu hao điện ở 7 bar', unit: 'kW/(m³/min)', def: 6.5, help: 'Máy trục vít có dầu 6–7; theo catalogue ISO 1217.' },
    { id: 'n', type: 'sel', label: 'Số máy nén', opts: [['1', '1'], ['2', '2'], ['3', '3'], ['4', '4']], def: '2' },
    { id: 'red', type: 'sel', label: 'Dự phòng', opts: [['n1', 'N+1 (1 máy dự phòng)'], ['none', 'Không, các máy cùng chạy']], def: 'n1', show: v => +v.n > 1 },
    { id: 'dryer', type: 'sel', label: 'Máy sấy khí', opts: [['ref', 'Sấy lạnh – điểm sương +3 °C'], ['des', 'Sấy hấp thụ – điểm sương −40 °C']], def: 'ref' },
    { id: 'tin', type: 'num', label: 'Nhiệt độ khí hút vào', unit: '°C', def: 35 },
    { id: 'rhin', type: 'num', label: 'Độ ẩm khí hút vào', unit: '%', def: 80 },
    { type: 'sec', label: 'Chi phí' },
    { id: 'hours', type: 'num', label: 'Số giờ chạy/năm', unit: 'h', def: 7000 },
    { id: 'price', type: 'num', label: 'Giá điện bình quân', unit: 'đ/kWh', def: 2000 }
  ],
  calc(v) {
    const rows = (v.cons || []).filter(r => r.sl > 0 && r.q > 0);
    if (!rows.length) return { error: 'Nhập ít nhất một thiết bị dùng khí.' };
    let sum = 0; const body = [];
    rows.forEach(r => { const d = clamp(r.duty > 0 ? r.duty : 100, 1, 100); const q = r.sl * r.q * d / 100; sum += q; body.push([r.ten || '—', f(r.sl), f(r.q, 0), f(d, 0), f(q, 0)]); });
    body.push({ cls: 'tot', cells: ['Tổng', '', '', '', f(sum, 0)] });
    const ks = v.ks > 0 ? Math.min(v.ks, 1) : 1;
    const Qm = sum / 1000 * ks, Qleak = Qm * (v.leak || 0) / 100, Qd = (Qm + Qleak) * (1 + (v.res || 0) / 100);
    const pset = (v.preq || 6) + (v.pdrop || 0);
    const SPa = (v.sp > 0 ? v.sp : 6.5) * (1 + 0.07 * (pset - 7));
    const n = +v.n || 1, n1 = n > 1 && v.red === 'n1', run = n1 ? n - 1 : n;
    const kWreq = Qd / run * SPa, kW = nextStd(CMP_KW, kWreq);
    if (!kW) return { error: `Mỗi máy cần ≈ ${f(kWreq, 0)} kW – tăng số máy nén.` };
    const FAD = kW / SPa;
    const vsd = v.type === 'vsd';
    const qc = FAD * 1000 / 60;
    const Vr = 0.25 * qc * 1 / ((1 / 30) * 0.5) * (vsd ? 0.5 : 1);
    const rcv = nextStd(RCV, Vr) || Math.ceil(Vr / 1000) * 1000;
    const dryerCap = run * FAD * 1.2;
    const pdp = v.dryer === 'des' ? -40 : 3;
    const pabs = (pset + 1.013) * 1e5;
    const w1 = wAbs(v.tin || 35, v.rhin || 80, 101325), w2 = 0.622 * pws(pdp) / (pabs - pws(pdp));
    const mAir = 1.204 * (Qm + Qleak) * 60;
    const cond = Math.max(0, mAir * (w1 - w2));
    const Pavg = (Qm + Qleak) * SPa;
    const E = Pavg * (v.hours || 0), cost = E * (v.price || 0);
    const Im = motorAmp(kW);
    const checks = [
      chk(OK, `${n} máy × ${kW} kW${n1 ? ' (1 dự phòng)' : ''}, mỗi máy FAD ≈ ${f(FAD, 2)} m³/min ở ${f(pset, 1)} bar g`),
      chk(pset > 7.5 ? WARN : OK, `Áp suất đặt ${f(pset, 1)} bar g. Mỗi 1 bar giảm được tiết kiệm ≈ 7% điện (≈ ${f(E * 0.07 / 1000, 0)} MWh/năm).`),
      chk(INFO, v.dryer === 'des' ? 'Sấy hấp thụ đạt độ ẩm class 2 – phù hợp khí tiếp xúc trực tiếp bao bì thực phẩm theo BCAS: ISO 8573-1 [2:2:1] (cần thêm lọc tinh 0,01 µm và lọc than hoạt tính, hoặc máy nén không dầu).' : 'Sấy lạnh đạt độ ẩm class 4 – đủ cho khí không tiếp xúc sản phẩm (BCAS: ISO 8573-1 [2:4:2]). Khí tiếp xúc trực tiếp bao bì thực phẩm cần [2:2:1]: sấy hấp thụ, lọc tinh và lọc than hoạt tính.')
    ];
    if ((v.leak || 0) > 15) checks.push(chk(WARN, `Rò rỉ ${f(v.leak)}% – nên kiểm tra rò rỉ định kỳ (xem module Rò rỉ khí nén).`));
    return {
      main: [
        { l: 'Máy nén đề xuất', v: `${n} × ${kW}`, u: 'kW', sub: `FAD ${f(FAD, 1)} m³/min mỗi máy, ${vsd ? 'biến tần' : 'tốc độ cố định'}`, s: 'hl' },
        { l: 'Nhu cầu thiết kế', v: f(Qd, 2), u: 'm³/min', sub: `Trung bình ${f(Qm + Qleak, 2)} m³/min gồm rò rỉ` },
        { l: 'Bình chứa khí', v: f(rcv, 0), u: 'lít', sub: `Tính toán ${f(Vr, 0)} lít` },
        { l: 'Điện năng/năm', v: f(E / 1000, 0), u: 'MWh', sub: `${f(cost / 1e6, 0)} triệu đồng` }
      ],
      checks,
      rows: [
        ['Tổng lưu lượng thiết bị (× Ks)', f(Qm, 2), 'm³/min'],
        ['Rò rỉ', f(Qleak, 2), 'm³/min'],
        ['Áp suất đặt máy nén', f(pset, 1), 'bar g'],
        ['Suất tiêu hao điện hiệu chỉnh theo áp', f(SPa, 2), 'kW/(m³/min)'],
        ['Dòng điện động cơ mỗi máy', f(Im, 0), 'A ở 400 V'],
        ['Máy sấy (≥ 1,2 × FAD các máy chạy)', f(dryerCap, 1), `m³/min, điểm sương ${pdp} °C`],
        ['Lọc', v.dryer === 'des' ? 'Lọc thô 1 µm trước sấy, lọc bụi 1 µm sau sấy' : 'Lọc thô 1 µm + lọc tinh 0,01 µm sau sấy', ''],
        ['Nước ngưng ở máy nén và máy sấy', f(cond, 1), `lít/h (≈ ${f(cond * 24, 0)} lít/ngày)`],
        ['Chi phí điện do rò rỉ/năm', f(Qleak * SPa * (v.hours || 0) * (v.price || 0) / 1e6, 0), 'triệu đồng']
      ],
      tables: [{ title: 'Tổng hợp nhu cầu', head: ['Thiết bị', 'SL', 'Nl/min', '%', 'Nl/min TB'], body }],
      steps: [
        `Q = Σ(SL × q × hệ số làm việc) × K<sub>s</sub> = ${f(sum, 0)} × ${f(ks, 2)} = ${f(Qm * 1000, 0)} Nl/min`,
        `Q<sub>TK</sub> = Q × (1 + rò rỉ) × (1 + dự phòng) = ${f(Qd, 2)} m³/min`,
        `Suất tiêu hao ở ${f(pset, 1)} bar = ${f(v.sp)} × (1 + 7% × (${f(pset, 1)} − 7)) = ${f(SPa, 2)} kW/(m³/min) → ${f(Qd / run, 2)} × ${f(SPa, 2)} = ${f(kWreq, 1)} kW → chọn ${kW} kW`,
        `Bình chứa V = 0,25 × q<sub>c</sub> × p<sub>1</sub> / (f<sub>max</sub> × Δp) = 0,25 × ${f(qc, 1)} × 1 / (1/30 × 0,5)${vsd ? ' × 0,5 (VSD)' : ''} = ${f(Vr, 0)} lít`,
        `Nước ngưng = ṁ<sub>khí</sub> × (w<sub>vào</sub> − w<sub>ra</sub>) = ${f(mAir, 0)} × (${f(w1, 5)} − ${f(w2, 5)}) = ${f(cond, 2)} kg/h`
      ],
      notes: ['Bình chứa tính cho máy tải/không tải, 2 chu kỳ/phút, dải áp 0,5 bar. Nên có thêm bình nhỏ gần các hộ dùng khí lớn, dao động.']
    };
  }
});

/* ===== 6.2 Đường ống khí nén ===== */
M({
  id: 'airpipe', grp: 4, tag: 'ỐK', name: 'Đường ống khí nén',
  desc: 'Chọn đường kính ống khí nén theo lưu lượng, chiều dài và tổn thất áp cho phép; kiểm tra vận tốc.',
  ref: 'Atlas Copco Compressed Air Manual: Δp = 450 × q<sub>c</sub><sup>1,85</sup> × l / (d<sup>5</sup> × p)',
  fields: [
    { id: 'Q', type: 'num', label: 'Lưu lượng (FAD)', unit: 'm³/min', def: 9 },
    { id: 'p', type: 'num', label: 'Áp suất làm việc', unit: 'bar g', def: 7 },
    { id: 'L', type: 'num', label: 'Chiều dài ống', unit: 'm', def: 200 },
    { id: 'fit', type: 'num', label: 'Chiều dài tương đương co, tê, van', unit: '% chiều dài', def: 30 },
    { id: 'layout', type: 'sel', label: 'Kiểu mạng ống', opts: [['line', 'Ống cụt (một chiều)'], ['ring', 'Mạch vòng']], def: 'ring' },
    { id: 'dp', type: 'num', label: 'Tổn thất áp cho phép', unit: 'bar', def: 0.1, help: 'Ống chính ≤ 0,1 bar; toàn hệ (ống + nhánh) nên ≤ 0,3 bar.' }
  ],
  calc(v) {
    if (!(v.Q > 0 && v.L > 0 && v.dp > 0)) return { error: 'Nhập lưu lượng, chiều dài và tổn thất áp cho phép.' };
    const ring = v.layout === 'ring';
    const qc = v.Q * 1000 / 60 / (ring ? 2 : 1), l = v.L * (1 + (v.fit || 0) / 100) / (ring ? 2 : 1), pa = (v.p || 7) + 1.013;
    const dmin = Math.pow(450 * Math.pow(qc, 1.85) * l / (v.dp * pa), 0.2);
    const dpOf = d => 450 * Math.pow(qc, 1.85) * l / (Math.pow(d, 5) * pa);
    const vel = d => (qc / 1000) * (1.013 / pa) / (Math.PI * Math.pow(d / 1000, 2) / 4);
    let i = PIPE_ID.findIndex(d => d >= dmin); if (i < 0) i = PIPE_ID.length - 1;
    const d = PIPE_ID[i], dn = PIPE_DN[i], dpA = dpOf(d), vA = vel(d);
    const body = [];
    for (let k = Math.max(0, i - 1); k <= Math.min(PIPE_ID.length - 1, i + 2); k++) body.push({ cls: k === i ? 'hl' : '', cells: [`DN${PIPE_DN[k]}`, f(PIPE_ID[k], 1), f(dpOf(PIPE_ID[k]), 3), f(vel(PIPE_ID[k]), 1)] });
    return {
      main: [
        { l: 'Ống đề xuất', v: `DN${dn}`, sub: `Đường kính trong ${f(d, 1)} mm (thép SCH40)`, s: 'hl' },
        { l: 'Đường kính trong tối thiểu', v: f(dmin, 1), u: 'mm', sub: 'Dùng để chọn ống nhôm, inox tương đương' },
        { l: 'Tổn thất áp', v: f(dpA, 3), u: 'bar', sub: `Cho phép ${f(v.dp, 2)} bar` },
        { l: 'Vận tốc khí', v: f(vA, 1), u: 'm/s', sub: 'Ống chính nên ≤ 6–8 m/s' }
      ],
      checks: [chk(dpA <= v.dp ? OK : BAD, `Tổn thất ${f(dpA, 3)} bar ${dpA <= v.dp ? '≤' : '>'} ${f(v.dp, 2)} bar`), chk(vA <= 8 ? OK : WARN, `Vận tốc ${f(vA, 1)} m/s${vA > 8 ? ' – cao, dễ cuốn nước ngưng vào thiết bị' : ''}`), ...(ring ? [chk(INFO, 'Mạch vòng: mỗi nhánh tính với 1/2 lưu lượng và 1/2 chiều dài.')] : [])],
      rows: [['Lưu lượng tính toán', f(qc, 1), 'L/s'], ['Chiều dài tính toán', f(l, 0), 'm'], ['Áp suất tuyệt đối', f(pa, 2), 'bar']],
      tables: [{ title: 'So sánh cỡ ống', head: ['Ống', 'ID (mm)', 'Δp (bar)', 'v (m/s)'], body }],
      steps: [`d = (450 × q<sub>c</sub><sup>1,85</sup> × l / (Δp × p))<sup>1/5</sup> = (450 × ${f(qc, 1)}<sup>1,85</sup> × ${f(l, 0)} / (${f(v.dp, 2)} × ${f(pa, 2)}))<sup>0,2</sup> = ${f(dmin, 1)} mm`]
    };
  }
});

    { id: 'price', type: 'num', label: 'Giá điện bình quân', unit: 'đ/kWh', def: 2000 }
  ],
  calc(v) {
    const rows = (v.holes || []).filter(r => r.d > 0 && r.n > 0);
    if (!rows.length || !(v.p > 0)) return { error: 'Nhập áp suất và ít nhất một điểm rò.' };
    const P = (v.p + 1.013) * 1e5, T = 293.15, cd = v.cd > 0 ? v.cd : 0.65;
    let Qt = 0; const body = [];
    rows.forEach(r => {
      const A = Math.PI * Math.pow(r.d / 1000, 2) / 4, m = 0.0404 * cd * A * P / Math.sqrt(T), q = m / 1.204 * 60 * r.n;
      Qt += q; body.push([r.ten || '—', f(r.d, 1), f(r.n), f(q * 1000 / 60, 1), f(q * (v.sp || 6.5), 2)]);
    });
    body.push({ cls: 'tot', cells: ['Tổng', '', '', f(Qt * 1000 / 60, 1), f(Qt * (v.sp || 6.5), 2)] });
    const kW = Qt * (v.sp || 6.5), E = kW * (v.hours || 0), cost = E * (v.price || 0);
    const pct = v.cap > 0 ? Qt / v.cap * 100 : null;
    return {
      main: [
        { l: 'Tiền điện mất/năm', v: f(cost / 1e6, 1), u: 'triệu đ', sub: `${f(E, 0)} kWh`, s: 'hl' },
        { l: 'Khí rò rỉ', v: f(Qt, 2), u: 'm³/min', sub: `${f(Qt * 1000 / 60, 1)} L/s` },
        { l: 'Công suất điện lãng phí', v: f(kW, 1), u: 'kW' },
        { l: 'Tỷ lệ so với máy nén', v: pct != null ? f(pct, 0) : '—', u: '%', sub: pct != null ? `trên ${f(v.cap)} m³/min` : '' }
      ],
      checks: pct != null ? [chk(pct <= 10 ? OK : pct <= 20 ? WARN : BAD, `Rò rỉ ${f(pct, 0)}% công suất máy nén ${pct <= 10 ? '– chấp nhận được' : '– nên tổ chức dò và sửa rò rỉ (máy dò siêu âm), thường hoàn vốn dưới 3 tháng'}`)] : [],
      tables: [{ title: 'Chi tiết điểm rò', head: ['Vị trí', 'd (mm)', 'SL', 'L/s', 'kW'], body }],
      steps: [`ṁ = 0,0404 × C<sub>d</sub> × A × p / √T; p = ${f(P / 1e5, 2)} bar tuyệt đối, T = 293 K; Q = ṁ / 1,204 kg/m³`, `P<sub>điện</sub> = Q × ${f(v.sp || 6.5, 1)} kW/(m³/min) = ${f(kW, 2)} kW`]
    };

M({
  id: 'pump', grp: 5, tag: 'BƠM', name: 'Chọn bơm và đường ống nước',
  desc: 'Tính cột áp toàn phần (tĩnh + ma sát), chọn cỡ ống theo vận tốc, công suất trục và động cơ bơm.',
  ref: 'Hazen-Williams: h<sub>f</sub> = 10,67 × L × Q<sup>1,852</sup> / (C<sup>1,852</sup> × d<sup>4,87</sup>); P = ρ·g·Q·H / η',
  fields: [
    { type: 'sec', label: 'Yêu cầu' },
    { id: 'Q', type: 'num', label: 'Lưu lượng', unit: 'm³/h', def: 100 },
    { id: 'Hs', type: 'num', label: 'Cột áp tĩnh + áp dư đầu ra', unit: 'm', def: 20, help: 'Chênh cao hình học + áp cần ở cuối tuyến (10 m ≈ 1 bar). Hệ tuần hoàn kín: 0.' },
    { id: 'Hx', type: 'num', label: 'Tổn thất thiết bị (bình, trao đổi nhiệt, van)', unit: 'm', def: 0, help: 'VD bình bay hơi chiller 5–8 m, lọc Y 1–2 m.' },
    { type: 'sec', label: 'Đường ống' },
    { id: 'L', type: 'num', label: 'Chiều dài ống', unit: 'm', def: 150 },
    { id: 'fit', type: 'num', label: 'Chiều dài tương đương co, tê, van', unit: '% chiều dài', def: 30 },
    { id: 'C', type: 'sel', label: 'Vật liệu ống', opts: [['120', 'Thép mới (C = 120)'], ['100', 'Thép cũ, gang (C = 100)'], ['140', 'PPR, HDPE, inox (C = 140)']], def: '120' },
    { id: 'dn', type: 'sel', label: 'Cỡ ống', opts: [['auto', 'Tự động theo vận tốc'], ...PIPE_DN.map(d => [String(d), 'DN' + d])], def: 'auto' },
    { id: 'vmax', type: 'num', label: 'Vận tốc tối đa', unit: 'm/s', def: 2, show: v => v.dn === 'auto' },
    { type: 'sec', label: 'Bơm' },
    { id: 'eta', type: 'num', label: 'Hiệu suất bơm', unit: '%', def: 75 },
    { id: 'margin', type: 'num', label: 'Dự phòng cột áp', unit: '%', def: 10 }
  ],
  calc(v) {
    if (!(v.Q > 0)) return { error: 'Nhập lưu lượng.' };
    const Qs = v.Q / 3600;
    let pp;
    if (v.dn === 'auto') pp = pickPipe(Qs, v.vmax > 0 ? v.vmax : 2);
    else { const i = PIPE_DN.indexOf(+v.dn); pp = { i, dn: PIPE_DN[i], id: PIPE_ID[i], v: Qs / pipeArea(i) }; }
    const d = pp.id / 1000, C = +v.C || 120, Leq = (v.L || 0) * (1 + (v.fit || 0) / 100);
    const hf = 10.67 * Leq * Math.pow(Qs, 1.852) / (Math.pow(C, 1.852) * Math.pow(d, 4.87));
    const H = ((v.Hs || 0) + (v.Hx || 0) + hf) * (1 + (v.margin || 0) / 100);
    const eta = clamp(v.eta || 75, 20, 95) / 100;
    const Ph = 9.81 * Qs * H, Psh = Ph / eta, Pm = motorFor(Psh * 1.1);
    const I = motorAmp(Pm);
    const per100 = Leq > 0 ? hf / Leq * 100 : 0;
    const checks = [
      chk(pp.v >= 0.6 && pp.v <= 3 ? OK : WARN, `Vận tốc trong ống ${f(pp.v, 2)} m/s${pp.v < 0.6 ? ' – thấp, dễ lắng cặn, ống quá lớn' : pp.v > 3 ? ' – cao, ồn và mòn ống' : ''}`),
      chk(per100 <= 5 ? OK : WARN, `Tổn thất ma sát ${f(per100, 2)} m/100 m ống${per100 > 5 ? ' – lớn, nên tăng cỡ ống' : ''}`),
      chk(INFO, `Chọn bơm có điểm làm việc Q = ${f(v.Q)} m³/h, H = ${f(H, 1)} m nằm gần điểm hiệu suất cao nhất (BEP) trên đường đặc tính.`)
    ];
    return {
      main: [
        { l: 'Cột áp bơm', v: f(H, 1), u: 'm', sub: `≈ ${f(H / 10.2, 2)} bar`, s: 'hl' },
        { l: 'Động cơ bơm', v: String(Pm), u: 'kW', sub: `Công suất trục ${f(Psh, 2)} kW, I ≈ ${f(I, 0)} A` },
        { l: 'Cỡ ống', v: `DN${pp.dn}`, sub: `v = ${f(pp.v, 2)} m/s` },
        { l: 'Tổn thất ma sát', v: f(hf, 2), u: 'm', sub: `${f(per100, 2)} m/100 m` }
      ],
      checks,
      rows: [
        ['Chiều dài tương đương', f(Leq, 0), 'm'],
        ['Đường kính trong ống', f(pp.id, 1), 'mm'],
        ['Công suất thủy lực', f(Ph, 2), 'kW'],
        ['Hiệu suất bơm', f(eta * 100, 0), '%']
      ],
      steps: [
        `h<sub>f</sub> = 10,67 × ${f(Leq, 0)} × ${f(Qs, 4)}<sup>1,852</sup> / (${C}<sup>1,852</sup> × ${f(d, 4)}<sup>4,87</sup>) = ${f(hf, 2)} m`,
        `H = (H<sub>tĩnh</sub> + H<sub>thiết bị</sub> + h<sub>f</sub>) × ${f(1 + (v.margin || 0) / 100, 2)} = (${f(v.Hs || 0)} + ${f(v.Hx || 0)} + ${f(hf, 2)}) × ${f(1 + (v.margin || 0) / 100, 2)} = ${f(H, 2)} m`,
        `P<sub>trục</sub> = ρ·g·Q·H / η = 9,81 × ${f(Qs, 4)} × ${f(H, 2)} / ${f(eta, 2)} = ${f(Psh, 2)} kW → động cơ ≥ 1,1 × P<sub>trục</sub> → ${Pm} kW`
      ],
      notes: ['Hazen-Williams áp dụng cho nước ở nhiệt độ thường. Với bơm tuần hoàn thay đổi lưu lượng, nên dùng biến tần (xem module Tiết kiệm điện bằng biến tần).']
    };
  }
});

    };
    const body = rows.map((r, i) => '<tr>' + fd.cols.map(c => `<td>${cell(c, r, i)}</td>`).join('') + `<td class="x"><button type="button" class="del" data-t="${fd.id}" data-del="${i}" aria-label="Xóa dòng">×</button></td></tr>`).join('');
    return `<div class="tbl-wrap"><table class="etbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><button type="button" class="add" data-add="${fd.id}">+ Thêm dòng</button>`;
  }
  function formHTML(m, raw) {
    let h = '', open = false;
    const close = () => { if (open) { h += '</div></div>'; open = false; } };
    for (const fd of m.fields) {
      if (fd.type === 'sec') { close(); h += `<div class="sec"><div class="sec-t">${fd.label}</div><div class="sec-b">`; open = true; continue; }
      if (!open) { h += '<div class="sec"><div class="sec-b">'; open = true; }
      h += fieldHTML(fd, raw[fd.id]);
    }
    close();
    return h;
  }

  /* ---------- Kết quả ---------- */
  const ICON = { ok: '✓', warn: '!', bad: '✕', info: 'i' };
  function resultHTML(r) {
    let h = '<div class="res-h">Kết quả</div>';
    if (!r) return h;
    if (r.error) return h + `<div class="chks"><div class="chk bad"><span class="ic">✕</span><span>${r.error}</span></div></div>`;
    if (r.main) h += '<div class="plates">' + r.main.map(k => `<div class="plate ${k.s || ''}${String(k.v).replace(/<[^>]+>/g, '').length > 7 ? ' long' : ''}"><div class="pl-l">${k.l}</div><div class="pl-v">${k.v}${k.u ? `<span class="u">${k.u}</span>` : ''}</div>${k.sub ? `<div class="pl-s">${k.sub}</div>` : ''}</div>`).join('') + '</div>';
    if (r.checks && r.checks.length) h += '<div class="chks">' + r.checks.map(c => `<div class="chk ${c.s}"><span class="ic">${ICON[c.s] || 'i'}</span><span>${c.t}</span></div>`).join('') + '</div>';
    if (r.rows && r.rows.length) h += '<div class="sub-h">Chi tiết</div><table class="kvt">' + r.rows.map(([a, b, c]) => `<tr><th>${a}</th><td>${b}${c ? ` <span class="u">${c}</span>` : ''}</td></tr>`).join('') + '</table>';
    (r.tables || []).forEach(t => {
      h += `<div class="sub-h">${t.title}</div><div class="tbl-wrap"><table class="rtbl"><thead><tr>${t.head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${t.body.map(row => `<tr${row.cls ? ` class="${row.cls}"` : ''}>${(row.cells || row).map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    });
    if (r.steps && r.steps.length) h += `<details class="steps"><summary>Diễn giải tính toán</summary><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol></details>`;
    if (r.notes && r.notes.length) h += `<div class="notes">${r.notes.map(n => `<p>${n}</p>`).join('')}</div>`;
    return h;
  }
  function toText(m, r, pv) {
    const strip = s => String(s == null ? '' : s).replace(/<sub>(.*?)<\/sub>/g, '$1').replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&amp;/g, '&');
    let t = `${m.name.toUpperCase()}\n`;
    if (r.error) return t + strip(r.error);
    t += '\nKết quả chính:\n';
    (r.main || []).forEach(k => { t += `- ${strip(k.l)}: ${strip(k.v)} ${strip(k.u || '')}${k.sub ? ` (${strip(k.sub)})` : ''}\n`; });
    if (r.checks && r.checks.length) { t += '\nKiểm tra:\n'; r.checks.forEach(c => { t += `[${c.s === 'ok' ? 'Đạt' : c.s === 'bad' ? 'Không đạt' : 'Lưu ý'}] ${strip(c.t)}\n`; }); }
    if (r.rows && r.rows.length) { t += '\nChi tiết:\n'; r.rows.forEach(([a, b, c]) => { t += `- ${strip(a)}: ${strip(b)} ${strip(c || '')}\n`; }); }
    return t.replace(/ +\n/g, '\n');
  }
  function copyText(txt) {
    const done = () => toast('Đã sao chép kết quả');
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(txt).then(done, () => fallback()); }
    else fallback();
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Không sao chép được – hãy chọn và sao chép thủ công'); }
      ta.remove();
    }
  }

  /* ---------- Trang module ---------- */
  function renderModule(m) {
    document.title = m.name + ' – Tính toán cơ điện nhà máy';
    let raw = rawVals(m), lastR = null;
    $('#main').innerHTML = `
      <div class="mod-head">
        <div class="crumb">${GROUPS[m.grp]}</div>
        <h1><span class="marker">${m.tag}</span><span>${m.name}</span></h1>
        <p class="desc">${m.desc}</p>
        <p class="ref"><b>Cơ sở tính:</b> ${m.ref}</p>
        <div class="actions">
          <button type="button" class="btn pri" id="bCopy">Sao chép kết quả</button>
          <button type="button" class="btn" id="bPrint">In hoặc lưu PDF</button>
          <button type="button" class="btn" id="bReset">Khôi phục số liệu mẫu</button>
        </div>
      </div>
      <div class="mod-grid">
        <form class="panel form" id="form" autocomplete="off" novalidate></form>
        <section class="panel result" id="result" aria-live="polite"></section>
      </div>
      <button type="button" class="fab" id="bFab">Xem kết quả</button>`;
    const form = $('#form'), res = $('#result');
    form.addEventListener('submit', e => e.preventDefault());

    function applyShow() {
      const pv = parsed(m, raw);
      for (const fd of m.fields) {
        if (!fd.id || !fd.show) continue;
        const w = form.querySelector(`[data-wrap="${fd.id}"]`);
        if (w) w.hidden = !fd.show(pv);
      }
    }
    function compute() {
      const pv = parsed(m, raw);
      try { lastR = m.calc(pv); } catch (err) { console.error(err); lastR = { error: 'Không tính được với số liệu này: ' + err.message }; }
      res.innerHTML = resultHTML(lastR);
    }
    function drawForm() { form.innerHTML = formHTML(m, raw); applyShow(); }
    function commit(redraw) { ST[m.id] = raw; save(); if (redraw) drawForm(); else applyShow(); compute(); }
    function onEdit(e) {
      const el = e.target;
      if (el.dataset.f) raw[el.dataset.f] = el.value;
      else if (el.dataset.t) { const rows = raw[el.dataset.t]; const i = +el.dataset.r; if (rows && rows[i]) rows[i][el.dataset.c] = el.value; }
      else return;
      commit(false);
    }
    form.addEventListener('input', onEdit);
    form.addEventListener('change', onEdit);
    form.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.add) { const fd = m.fields.find(x => x.id === b.dataset.add); raw[fd.id] = raw[fd.id] || []; raw[fd.id].push(clone(fd.newRow)); commit(true); }
      else if (b.dataset.del !== undefined) { raw[b.dataset.t].splice(+b.dataset.del, 1); commit(true); }
    });
    $('#bCopy').addEventListener('click', () => { if (lastR) copyText(toText(m, lastR)); });
    $('#bPrint').addEventListener('click', () => { const d = res.querySelector('details'); if (d) d.open = true; window.print(); });
    $('#bReset').addEventListener('click', () => { delete ST[m.id]; save(); raw = rawVals(m); drawForm(); compute(); toast('Đã khôi phục số liệu mẫu'); });
    $('#bFab').addEventListener('click', () => res.scrollIntoView({ behavior: 'smooth', block: 'start' }));
    if ('IntersectionObserver' in window) {
      const fab = $('#bFab');
      new IntersectionObserver(es => { fab.hidden = es[0].isIntersecting; }).observe(res);
    }
    drawForm(); compute();
  }

  /* ---------- Điều hướng ---------- */
  function route() {
    const id = location.hash.replace('#', '');
    const m = MODULES.find(x => x.id === id);
    document.body.classList.remove('nav-open');
    renderNav(m ? m.id : '');
    if (m) renderModule(m); else renderHome();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('beforeprint', () => { const d = document.querySelector('.steps'); if (d) d.open = true; });
  $('#btnMenu').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
  route();
})();

</script>
</body>
</html>
